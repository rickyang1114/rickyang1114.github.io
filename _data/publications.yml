- title: "ProSPy: A Profiling-Driven SQL-Python Agentic Framework for Enterprise Text-to-SQL"
  venue: "Under review"
  url: "https://arxiv.org/abs/2606.05836"
  image: "/files/prospy/prospy.png"
  authors: "<strong>Zhaorui Yang</strong>, Huawei Zheng, Sen Yang, Yuhui Zhang, Haoxuan Li, Zhizhen Yu, Xuan Yi, Chen Hou, Defeng Xie, Chao Hu, Minfeng Zhu, Dazhen Deng, Haozhe Feng, Danqing Huang, Peng Chen, Wei Chen"
  summary: "Real-world Text-to-SQL faces heterogeneous schemas, incomplete metadata, SQL dialects, and complex analytical queries. We proposed a profiling-driven SQL–Python agentic framework that combines efficient SQL-based retrieval with flexible Python analysis. ProSPy ranked No. 2 on Spider 2.0-Lite at submission; its improved successor, Tianqiong Data Agent, ranked No. 1 as reported in my September 2026 résumé."
  links:
    - {label: "Paper", url: "https://arxiv.org/abs/2606.05836"}

- title: "CoSDA: Continual Source-Free Domain Adaptation"
  venue: "arXiv · 2023"
  url: "https://arxiv.org/abs/2304.06627"
  image: "/files/cosda/cosda_setting.png"
  image_alt: "Continual source-free domain adaptation setting"
  authors: "Haozhe Feng*, <strong>Zhaorui Yang*</strong>, Hesun Chen*, Tianyu Pang, Chao Du, Minfeng Zhu, Wei Chen, Shuicheng Yan"
  summary: "Continual source-free domain adaptation suffers from catastrophic forgetting when adapting to a sequence of target domains. We identified a trade-off between adaptation gain and forgetting loss, and proposed CoSDA to balance adaptation and knowledge retention, outperforming prior methods under continuous domain shifts."
  repository: "FengHZ/CoSDA"
  links:
    - {label: "Paper", url: "https://arxiv.org/pdf/2304.06627"}
    - {label: "Code", url: "https://github.com/FengHZ/CoSDA"}
