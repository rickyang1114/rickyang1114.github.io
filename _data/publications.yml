- title: "Multimodal DeepResearcher: Generating Text-Chart Interleaved Reports From Scratch with Agentic Framework"
  venue: "AAAI 2026"
  distinction: "Oral"
  url: "https://ojs.aaai.org/index.php/AAAI/article/view/40734"
  image: "/files/multimodal_deepresearcher/multimodal_deepresearcher_framework.png"
  image_alt: "Multimodal DeepResearcher framework for generating text and charts"
  authors: "<strong>Zhaorui Yang*</strong>, Bo Pan*, Han Wang*, Yiyao Wang, Xingyu Liu, Luoxuan Weng, Yingchaojie Feng, Haozhe Feng, Minfeng Zhu, Bo Zhang, Wei Chen"
  summary: "DeepResearch systems typically generate text-only reports, despite visualizations being essential for real-world analysis. We introduced an agentic framework that generates text-chart interleaved reports from scratch, together with a structured chart representation that enables LLMs to produce diverse, high-quality visualizations."
  citations: 26
