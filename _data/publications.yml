- title: "Self-Distillation Bridges Distribution Gap in Language Model Fine-Tuning"
  venue: "ACL 2024"
  url: "https://aclanthology.org/2024.acl-long.58"
  image: "/files/sdft/sdft.png"
  image_alt: "Self-Distillation Fine-Tuning method"
  authors: "<strong>Zhaorui Yang</strong>, Tianyu Pang, Haozhe Feng, Han Wang, Wei Chen, Minfeng Zhu, Qian Liu"
  summary: "Fine-tuning LLMs often improves downstream performance at the cost of general capabilities. We attributed this trade-off to the distribution gap between task data and the pretrained model, and proposed Self-Distillation Fine-Tuning (SDFT) to bridge this gap by aligning fine-tuning data with the model’s original distribution."
  citations: 132
  repository: "sail-sg/sdft"
  links:
    - {label: "Paper", url: "https://aclanthology.org/2024.acl-long.58.pdf"}
    - {label: "Code", url: "https://github.com/sail-sg/sdft"}
